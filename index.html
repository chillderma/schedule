<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>李嘉倫醫師門診表</title>
<meta name="description" content="李嘉倫醫師各診所門診時間表，可依地點、時段、醫美／健保查詢。">
<meta property="og:title" content="李嘉倫醫師門診表">
<meta property="og:description" content="各診所門診時間，可依地點、時段查詢，LINE 直接預約。">
<meta name="theme-color" content="#2F5D62">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="css">
/* Layout: one calm column — header, filter bar, month calendar (list on phones), clinic cards. Editor slides in as a full panel for the maintainer only. */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#1C2430; --muted:#66707E; --line:#E1E5EA;
  --accent:#2F5D62; --accent-soft:#E3EEEE; --course:#6E58A0; --course-soft:#EEEAF6;
  --off:#8A929C; --off-soft:#EEF0F2; --warn:#B4552D; --alert:#A3243B; --alert-soft:#FCE9ED; --gray-ink:#6B7480; --line-green:#06A44C;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171C; --surface:#1A2128; --ink:#E7ECF0; --muted:#98A2AE; --line:#2B343D;
  --accent:#7DB5B9; --accent-soft:#1F3234; --course:#B4A2E0; --course-soft:#2A2440;
  --off:#7D8792; --off-soft:#222A31; --warn:#E39A78; --alert:#F2A3B1; --alert-soft:#3A1E26; --gray-ink:#A6AFBA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1A2128; --ink:#E7ECF0; --muted:#98A2AE; --line:#2B343D;
  --accent:#7DB5B9; --accent-soft:#1F3234; --course:#B4A2E0; --course-soft:#2A2440;
  --off:#7D8792; --off-soft:#222A31; --warn:#E39A78; --alert:#F2A3B1; --alert-soft:#3A1E26; --gray-ink:#A6AFBA; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:flex;flex-direction:column;gap:20px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.hd .who{font-size:13px;letter-spacing:.12em;color:var(--muted)}
.hd h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,5vw,36px);line-height:1.25;margin:2px 0 0;text-wrap:balance}
.months{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frow .lab{font-size:12px;color:var(--muted);letter-spacing:.08em;width:3.2em;flex:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:500}
.banner{border-radius:var(--r);padding:12px 16px;font-size:17px;line-height:1.7;background:var(--alert-soft);color:var(--alert)}
.banner b{font-weight:700}
.sample{background:var(--off-soft);border:1px dashed var(--off);color:var(--muted);font-size:14px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .wd{background:var(--surface);text-align:center;font-size:12px;color:var(--muted);padding:6px 0;letter-spacing:.1em}
.cal .wd.we{color:var(--warn)}
.cell{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell.blank{background:var(--bg)}
.cell .n{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cell.today .n{color:var(--bg);background:var(--accent);border-radius:999px;width:24px;text-align:center}
.cell.past{opacity:.58}
.slot{display:flex;align-items:center;gap:4px;border-radius:6px;padding:2px 6px;font-size:12.5px;line-height:1.4;color:#fff;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .s{opacity:.85}
.slot .nhi{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.28);border-radius:4px;padding:0 4px}
.tag{font-size:12px;border-radius:6px;padding:2px 6px}
.tag.course,.tag.off{background:var(--alert-soft);color:var(--alert);font-weight:700;font-size:15px}
.cell .tag{padding:4px 6px;text-align:center}
.list{display:none;flex-direction:column;gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start}
.day.past{opacity:.6}
.day.today{border-color:var(--accent)}
.day .dt{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;line-height:1.2}
.day .dt small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.day .ss{display:flex;flex-direction:column;gap:6px;min-width:0}
.lslot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.lslot .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.lslot .k{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
@media (max-width:719px){.cal{display:none}.list{display:flex}}
/* clinic cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.meta{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.meta .ph{display:flex;align-items:center;gap:8px}
.mini{border:1px solid var(--line);background:none;border-radius:6px;font-size:12px;padding:1px 8px;color:var(--muted)}
.wk{width:100%;border-collapse:collapse;font-size:14px}
.wk td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top}
.wk td:first-child{width:3em;color:var(--muted)}
.wk td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.chg{font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px}
.chg b{font-weight:500}
.book{align-self:flex-start;text-decoration:none;background:var(--accent);color:var(--bg);border-radius:999px;padding:6px 16px;font-size:14px}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.linebtn{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;background:var(--line-green);color:#fff;text-decoration:none;border-radius:14px;padding:10px 18px 10px 14px;box-shadow:0 2px 10px rgba(6,140,70,.22);line-height:1.25}
.linebtn:hover{filter:brightness(1.05)}
.linebtn svg{width:30px;height:30px;flex:none}
.linebtn b{display:block;font-size:18px;font-weight:700}
.hdr{align-items:flex-end}
.avatar{height:104px;width:auto;flex:none}
.linebtn small{display:block;font-size:12px;opacity:.9}
@media (max-width:560px){.hdr{width:100%;flex-wrap:nowrap;align-items:center}.avatar{height:80px}.linebtn{flex:1;justify-content:center}}
.adj{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;align-self:flex-start}
.ownerbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ownerbar .obt{font-size:13px;color:var(--muted)}
.ownerbar .obt b{color:var(--warn)}
.obmini{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12px;opacity:.85}
.slot.lt .nhi{background:rgba(255,255,255,.55)}
.has-ob .wrap{padding-bottom:120px}
.mseg{display:flex;gap:8px;flex-wrap:wrap}
.mbtn{flex:1;min-width:130px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;text-align:left;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mbtn b{font-size:17px}
.mbtn small{font-size:12px;color:var(--muted)}
.mbtn[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.cell.adjcell{box-shadow:inset 0 0 0 2px var(--alert)}
.tag.adjtag{background:var(--alert-soft);color:var(--alert);font-weight:700;font-size:13px}
.cell .tag.adjtag{padding:1px 6px}
.slot.chgd{font-weight:700}
.slot.chgd .nhi{background:var(--off-soft)}
.lslot.chgd b,.lslot.chgd .t{color:var(--alert);font-weight:700}
.lslot .k.new{border-color:var(--alert);color:var(--alert)}
.hint b{color:var(--alert)}
.chg b{font-weight:700}
.banner b{font-weight:700}
.md .st.extra{background:var(--accent-soft);color:var(--accent)}
.xrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.xrow select,.xrow input{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--ink);min-width:0}
@media (max-width:520px){.xrow{grid-template-columns:1fr 1fr}.xrow .btn{grid-column:1/-1;justify-self:start}}
.xd{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:-6px}
.wk.xw td:first-child{width:auto;white-space:nowrap;padding-right:10px}
.xt2{display:flex;gap:6px;min-width:0}
.xt2 select,.xt2 input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--ink)}
.banner.gray{background:var(--off-soft);color:var(--gray-ink)}
.tag.course{background:var(--off-soft);color:var(--gray-ink)}
.md .st.course{background:var(--off-soft);color:var(--gray-ink)}
.editbtn{border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
/* editor */
.ed{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ed .wrap{gap:16px}
.edtop{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-block:10px;border-bottom:1px solid var(--line)}
.edtop h2{margin:0;font-size:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
.btn.danger{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-size:16px}
.hint{font-size:13px;color:var(--muted);margin:0}
.scroll{overflow-x:auto}
.grid{border-collapse:collapse;min-width:520px;width:100%}
.grid th,.grid td{border:1px solid var(--line);padding:6px;text-align:center;font-size:14px}
.grid th{font-weight:500;color:var(--muted);background:var(--bg)}
.grid td.na{background:var(--bg);color:var(--muted);font-size:12px}
.grid select{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--surface)}
.grid select.on{border-color:var(--accent);background:var(--accent-soft)}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mcal .h{font-size:12px;color:var(--muted);text-align:center}
.md{border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:52px;padding:4px;font-size:13px;text-align:left;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.md.sel{outline:2px solid var(--accent)}
.md .st{font-size:11px;border-radius:4px;padding:0 3px;align-self:flex-start}
.md .st.off,.md .st.course{background:var(--alert-soft);color:var(--alert)}
.md .st.custom{background:var(--accent-soft);color:var(--accent)}
.md .dots{display:flex;gap:2px}
.md .dots i{width:7px;height:7px;border-radius:50%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld input,.fld select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--ink);min-width:0}
.fld input[type=color]{padding:2px;height:38px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:40}
.modal{position:fixed;inset:0;background:rgba(10,14,18,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--surface);border-radius:var(--r);padding:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal img{width:100%;border:1px solid var(--line);border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"></div>
<script>
/* ===== 設定 =====
   放在 帳號.github.io/repo名稱 時會自動判斷，不用填。
   綁自己的網域後，請填上 GitHub 帳號與 repository 名稱。 */
const CONFIG = {
  owner: "",          // GitHub 帳號，例如 "drli-clinic"
  repo: "",           // Repository 名稱，例如 "schedule"
  branch: "main",
  path: "data.json"
};
</script>
<script id="main">
(()=>{
const S=['am','pm','ev'], SL={am:'上午',pm:'下午',ev:'晚上',full:'整段'};
const WDO=[1,2,3,4,5,6,0], WDL=['日','一','二','三','四','五','六'];
const TL={aes:'醫美',nhi:'健保'};
const KL={aes:'只有醫美',nhi:'只有健保',mixed:'醫美、健保都有（依時段分）'};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=null;
const ui={month:null,clinic:'all',sess:'all',type:'all',view:'cal'};
let custView=false,savedJSON='';
let canEdit=false, editing=false, draft=null, ed={tab:'week',month:null,day:null};
const pad=n=>String(n).padStart(2,'0');
const now=new Date(); const todayStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const curYM=todayStr.slice(0,7);
const clinicOf=(st,id)=>st.clinics.find(c=>c.id===id);
const monthKeys=st=>Object.keys(st.months).sort();
function pickMonth(st){const ks=monthKeys(st);return ks.find(k=>k>=curYM)||ks[ks.length-1]||curYM}
function daysIn(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()}
function wdOf(ds){const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).getDay()}
/* 時間解析：「13:00–20:00」→ 分鐘 */
function parseRange(str){const m=String(str||'').match(/(\d{1,2})(?::(\d{2}))?\s*[-–—~～至到]\s*(\d{1,2})(?::(\d{2}))?/);if(!m)return null;return [(+m[1])*60+(+(m[2]||0)),(+m[3])*60+(+(m[4]||0))]}
const SB={am:[0,720],pm:[720,1080],ev:[1080,1440]};
function sessOfRange(r){if(!r)return['pm'];return S.filter(s=>r[0]<SB[s][1]&&r[1]>SB[s][0])}
const rangesOf=c=>(c.ranges&&c.ranges.length?c.ranges:(c.range?[c.range]:[])).filter(Boolean);
const timeOf=(c,s,x)=>(x&&x.tm)||(s==='full'?(rangesOf(c)[0]||''):(c.hours?.[s]||''));
function sessionsOf(st,x){const c=clinicOf(st,x.c);return x.s==='full'?sessOfRange(parseRange(c?timeOf(c,'full',x):'')):[x.s]}
function sessLabel(st,x){if(x.s!=='full')return SL[x.s];const ss=sessionsOf(st,x);return ss.length>1?`${SL[ss[0]]}～${SL[ss[ss.length-1]]}`:SL[ss[0]]}
function igTime(t){const r=parseRange(t);if(!r)return'';const f=m=>{const h=m/60;return Number.isInteger(h)?String(h):String(Math.round(h*100)/100)};return `${f(r[0])}–${f(r[1])}`}
function shortTime(t){const r=parseRange(t);if(!r)return'';const f=m=>m%60?`${Math.floor(m/60)}:${pad(m%60)}`:`${m/60}`;return `${f(r[0])}–${f(r[1])}`}
function startMin(st,x){if(x.s==='full'){const c=clinicOf(st,x.c);const r=parseRange(c?timeOf(c,'full',x):'');return r?r[0]:780}const r=parseRange(clinicOf(st,x.c)?.hours?.[x.s]);return r?r[0]:SB[x.s][0]+540}
const typeOf=(c,v)=>c.kind==='aes'||c.kind==='nhi'?c.kind:(v.t==='nhi'?'nhi':'aes');
function hexRgb(h){h=String(h||'#888').replace('#','');if(h.length===3)h=h.split('').map(z=>z+z).join('');const v=parseInt(h,16);return [v>>16&255,v>>8&255,v&255]}
const toHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
function slotColors(c,t){if(c.kind==='mixed'&&t==='nhi'){const r=hexRgb(c.color);return {bg:toHex(r.map(v=>v+(255-v)*.62)),fg:toHex(r.map(v=>v*.62)),light:true}}return {bg:c.color,fg:'#FFFFFF',light:false}}
function validSlot(c,s){return c&&(s==='full'?c.mode==='range':(c.mode==='split'||!c.mode))}
function extraSlots(st,ov){const out=[];(ov.extra||[]).forEach(v=>{const c=clinicOf(st,v.c);if(!c)return;const t=typeOf(c,v);
  if(v.s&&v.s!=='full'){if(c.hours?.[v.s])out.push({s:v.s,c:v.c,t,ex:1})}else if(parseRange(v.tm))out.push({s:'full',c:v.c,t,tm:v.tm,ex:1})});return out}
function dayInfo(st,ym,ds){
  const mo=st.months[ym]; if(!mo) return {slots:[]};
  const ov=(mo.days||{})[ds];
  if(ov&&(ov.mode==='off'||ov.mode==='course')) return {special:ov.mode,note:ov.note||'',slots:[]};
  const src=ov&&ov.mode==='custom'?(ov.slots||{}):null; const wd=wdOf(ds);
  const slots=[...S,'full'].map(s=>{const v=src?src[s]:(mo.weekly||{})[`${wd}-${s}`];const c=v&&clinicOf(st,v.c);return validSlot(c,s)?{s,c:v.c,t:typeOf(c,v),tm:v.tm||(s==='full'?(rangesOf(c)[0]||''):undefined)}:null}).filter(Boolean);
  if(ov&&ov.mode==='extra')slots.push(...extraSlots(st,ov));
  slots.sort((a,b)=>startMin(st,a)-startMin(st,b));
  return {special:ov&&ov.mode==='custom'?'custom':null,note:ov?.note||'',slots};
}
function activeClinics(st,ym){const set=new Set();for(let d=1;d<=daysIn(ym);d++)dayInfo(st,ym,`${ym}-${pad(d)}`).slots.forEach(x=>set.add(x.c));return st.clinics.filter(c=>set.has(c.id))}
const pass=x=>(ui.clinic==='all'||x.c===ui.clinic)&&(ui.sess==='all'||sessionsOf(state,x).includes(ui.sess))&&(ui.type==='all'||x.t===ui.type);
const ymLabel=ym=>{const [y,m]=ym.split('-');return `${y} 年 ${+m} 月`};
const hoursText=c=>c.mode==='range'?'':S.filter(s=>c.hours?.[s]).map(s=>`${SL[s]} ${c.hours[s]}`).join('　');
const spName=m=>m==='course'?'進修':'休診';

/* ---------- public view ---------- */
function baseInfo(st,ym,ds){const mo=st.months[ym];return dayInfo({...st,months:{[ym]:{...mo,days:{}}}},ym,ds)}
/* 比對調整前後：回傳 items 與「調整後的時段」索引 */
function dayDiff(st,ym,ds,info){
  const now=info.slots, base=baseInfo(st,ym,ds).slots;
  const tmOf=x=>timeOf(clinicOf(st,x.c),x.s,x);
  const same=(a,b)=>a.c===b.c&&a.t===b.t&&tmOf(a)===tmOf(b);
  const uN=new Set(),uB=new Set(),pairs=[];
  now.forEach((n,i)=>{const j=base.findIndex((b,k)=>!uB.has(k)&&same(n,b));if(j>=0){uN.add(i);uB.add(j)}});
  const pairBy=f=>now.forEach((n,i)=>{if(uN.has(i))return;const j=base.findIndex((b,k)=>!uB.has(k)&&f(n,b));if(j>=0){uN.add(i);uB.add(j);pairs.push({type:'chg',b:base[j],n,i})}});
  pairBy((n,b)=>n.c===b.c);
  pairBy((n,b)=>sessionsOf(st,n).some(s=>sessionsOf(st,b).includes(s)));
  const items=[...pairs];
  now.forEach((n,i)=>{if(!uN.has(i))items.push({type:'add',n,i})});
  base.forEach((b,k)=>{if(!uB.has(k))items.push({type:'del',b})});
  items.sort((p,q)=>startMin(st,p.b||p.n)-startMin(st,q.b||q.n));
  return {items,changed:new Set(items.filter(x=>x.n).map(x=>x.i))};
}
function diffHTML(st,items){
  const nm=x=>esc(clinicOf(st,x.c).short||clinicOf(st,x.c).name), tm=x=>esc(timeOf(clinicOf(st,x.c),x.s,x));
  const tt=(a,b)=>a.t!==b.t?`・${TL[b.t]}`:'';
  if(!items.length)return '門診照常';
  return items.map(it=>{
    if(it.type==='chg')return `${sessLabel(st,it.b)} ${nm(it.b)}原時段 ${tm(it.b)}　更動為 <b>${it.n.c!==it.b.c?nm(it.n)+' ':''}${tm(it.n)}${tt(it.b,it.n)}</b>`;
    if(it.type==='add')return `<b>新增 ${sessLabel(st,it.n)} ${nm(it.n)} ${tm(it.n)}</b>`;
    return `${sessLabel(st,it.b)} ${nm(it.b)}原時段 ${tm(it.b)}　更動為 <b>暫停</b>`;
  }).join('；');
}

function slotChip(st,x,chg){const c=clinicOf(st,x.c);const tm=timeOf(c,x.s,x);const col=slotColors(c,x.t);
  const lab=chg||x.s==='full'?shortTime(tm)||'整段':SL[x.s];

  return `<div class="slot${col.light&&!chg?' lt':''}${chg?' chgd':''}" style="${sty}" title="${chg?'調整後：':''}${sessLabel(st,x)} ${esc(tm)} ${esc(c.name)} ${TL[x.t]}"><span class="s">${esc(lab)}</span>${esc(c.short||c.name)}${x.t==='nhi'?`<span class="nhi">健保</span>`:''}</div>`}

      }${cust?`<span class="hint">${diffHTML(st,df.items)}${i.note?'　'+esc(i.note):''}</span>`:''}</div></div>`}

async function makeImage(st,ym){
  try{await document.fonts.load('700 40px "Noto Sans TC"');await document.fonts.load('600 60px "Noto Serif TC"')}catch(e){}
  const W=1080,H=1350,P=40,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');

  const SA={am:'早',pm:'午',ev:'晚'};

  let maxSlots=1;const infos=[];for(let d=1;d<=n;d++){const i=dayInfo(st,ym,`${ym}-${pad(d)}`);infos.push(i);maxSlots=Math.max(maxSlots,i.slots.length)}
  const lines=withH.length+(noH.length?1:0),legSpan=40+44+Math.max(0,lines-1)*40+66+8;
  const gx=P,gy=P+128,cw=(W-2*P)/7,hh=40,ch=Math.min(cw*1.06,(H-P-gy-hh-legSpan)/rows);
  const shift=Math.max(0,(H-P-(gy+hh+rows*ch+legSpan))/2);x.translate(0,shift);
  x.fillStyle='#66707E';x.font=F(500,26);x.fillText(st.subtitle||'',P+4,P+26);
  x.fillStyle='#1C2430';x.font=F(600,60,'serif');x.fillText(`${st.doctor}  ${+ym.slice(5)}月門診`,P+4,P+96);
  x.fillStyle='#2F5D62';x.font=F(500,28);x.textAlign='right';x.fillText(ym.slice(0,4),W-P-4,P+96);x.textAlign='left';
  WDO.forEach((w,i)=>{x.fillStyle=(w===0||w===6)?'#B4552D':'#66707E';x.font=F(700,24);x.textAlign='center';x.fillText(WDL[w],gx+cw*i+cw/2,gy+27)});x.textAlign='left';
  const top0=30,avail=ch-4-top0-8,sh=Math.min(54,avail/maxSlots-5);
  for(let d=1;d<=n;d++){const k=lead+d-1,cx=gx+(k%7)*cw,cy=gy+hh+Math.floor(k/7)*ch,i=infos[d-1];
    x.fillStyle='#FFFFFF';rr(cx+2,cy+2,cw-4,ch-4,10);x.fill();
    x.fillStyle='#66707E';x.font=F(700,21);x.fillText(String(d),cx+10,cy+24);
    const top=cy+top0;
    if(i.special==='course'||i.special==='off'){const cs=i.special==='course';x.fillStyle=cs?'#EEF0F2':'#FCE9ED';rr(cx+7,top,cw-14,avail,8);x.fill();x.fillStyle=cs?'#6B7480':'#A3243B';x.font=F(700,32);x.textAlign='center';x.fillText(spName(i.special),cx+cw/2,top+avail/2+12);x.textAlign='left';continue}
    if(i.special==='custom'&&dayDiff(st,ym,`${ym}-${pad(d)}`,i).items.length){x.fillStyle='#A3243B';x.font=F(700,16);x.textAlign='right';x.fillText('門診調整',cx+cw-10,cy+23);x.textAlign='left'}
    const dfi=i.special==='custom'?dayDiff(st,ym,`${ym}-${pad(d)}`,i):null,chs=dfi?dfi.changed:new Set();
    if(dfi&&dfi.items.length){x.strokeStyle='#A3243B';x.lineWidth=3;rr(cx+3.5,cy+3.5,cw-7,ch-7,10);x.stroke()}
    i.slots.forEach((s,j)=>{const c=clinicOf(st,s.c),y=top+j*(sh+5),col=slotColors(c,s.t),cg=chs.has(j),ink=col.light?col.fg:c.color;
      if(cg){x.fillStyle='#FFFFFF';rr(cx+8.5,y+1.5,cw-17,sh-3,7);x.fill();x.strokeStyle=ink;x.lineWidth=3;x.stroke()}else{x.fillStyle=col.bg;rr(cx+7,y,cw-14,sh,7);x.fill()}
      const full=s.s==='full',tmS=timeOf(c,s.s,s),lab=full||cg?igTime(tmS):SA[s.s];
      x.fillStyle=cg?ink:col.fg;const txt=`${lab} ${c.short||c.name}`,mw=cw-(s.t==='nhi'?50:28);let fz=Math.round(sh*.5);x.font=F(700,fz);while(fz>13&&x.measureText(txt).width>mw){fz--;x.font=F(700,fz)}x.fillText(txt,cx+14,y+sh/2+fz*.36);
      if(s.t==='nhi'){x.font=F(700,Math.min(22,Math.round(sh*.42)));x.textAlign='right';x.fillText('健',cx+cw-13,y+sh/2+7);x.textAlign='left'}});
  }
  let ly=gy+hh+rows*ch+40;
  x.fillStyle='#66707E';x.font=F(400,22);x.fillText('早＝上午　午＝下午　晚＝晚上　.5＝30分　健＝健保（淺色）　紅框白底＝當日調整後時段',P+4,ly,W-2*P);ly+=44;
  const dots=(c,lx,y)=>{x.fillStyle=c.color;x.beginPath();x.arc(lx+9,y-8,9,0,7);x.fill();if(c.kind==='mixed'){x.fillStyle=slotColors(c,'nhi').bg;x.beginPath();x.arc(lx+30,y-8,9,0,7);x.fill();return lx+46}return lx+26};
  withH.forEach(c=>{const nx=dots(c,P+4,ly);x.fillStyle='#1C2430';x.font=F(700,26);x.fillText(c.name,nx,ly,460);const nw=Math.min(460,x.measureText(c.name).width);
    x.fillStyle='#4A5360';x.font=F(500,24);x.fillText(S.filter(s=>c.hours?.[s]).map(s=>`${SA[s]} ${igTime(c.hours[s])||c.hours[s]}`).join('　'),nx+nw+20,ly,W-P-(nx+nw+20));ly+=40});
  if(noH.length){let lx=P+4;noH.forEach(c=>{x.font=F(700,26);const w=x.measureText(c.name).width;const nx=dots(c,lx,ly);x.fillStyle='#1C2430';x.fillText(c.name,nx,ly,W-P-nx);lx=nx+w+26});}
  x.fillStyle='#8A929C';x.font=F(400,21);x.fillText(st.footnote||'',P+4,(noH.length?ly:ly-40)+66,W-2*P);x.setTransform(1,0,0,1,0,0);

}

  if(t.id==='edMonth'){ed.month=t.value;ed.day=null;ed.confirmDel=false}
  else if(t.dataset.wk){const v=parse(t.value);if(v)mo.weekly[t.dataset.wk]=v;else delete mo.weekly[t.dataset.wk]}
  else if(t.dataset.xc!=null){const o=mo.days[ed.day],j=+t.dataset.xc;const [c,ty]=t.value.split('|');const cl=clinicOf(draft,c);const nv=newExtra(draft,cl);nv.t=ty;o.extra[j]=nv}
  else if(t.dataset.xs!=null){const v=mo.days[ed.day].extra[+t.dataset.xs],val=t.value;if(val==='other'){v.s='full';v.o=true;v.tm=''}else if(val.startsWith('r|')){v.s='full';v.tm=val.slice(2);delete v.o}else{v.s=val;delete v.tm;delete v.o}}
  else if(t.dataset.xt!=null){const v=mo.days[ed.day].extra[+t.dataset.xt];v.tm=t.value.trim();v.s='full'}
  else if(t.dataset.ct){const o=mo.days[ed.day];const v=o.slots?.[t.dataset.ct];if(v){const val=t.value.trim();if(val)v.tm=val;else delete v.tm}}
  else if(t.dataset.cs){const o=mo.days[ed.day];o.slots=o.slots||{};const v=parse(t.value);if(v)o.slots[t.dataset.cs]=v;else delete o.slots[t.dataset.cs]}
  else if(t.dataset.sel){draft.clinics[+t.dataset.c][t.dataset.sel]=t.value}
  else if(t.dataset.k==='color'){draft.clinics[+t.dataset.c].color=t.value}
  else return;
  saveDraft();render();
});
document.addEventListener('input',e=>{if(!editing)return;const t=e.target,mo=draft.months[ed.month];
  if(t.id==='dNote'&&mo.days[ed.day])mo.days[ed.day].note=t.value;
  else if(t.dataset.g)draft[t.dataset.g]=t.value;
  else if(t.dataset.c!=null&&t.dataset.k&&t.dataset.k!=='color')draft.clinics[+t.dataset.c][t.dataset.k]=t.value;
  else if(t.dataset.rg){const c=draft.clinics[+t.dataset.c];c.ranges=t.value.split(/[、,，;；\n]+/).map(x=>x.trim()).filter(Boolean);delete c.range}
  else if(t.dataset.c!=null&&t.dataset.h){const c=draft.clinics[+t.dataset.c];c.hours=c.hours||{};c.hours[t.dataset.h]=t.value}
  else return;
  saveDraft();
});

/* ---------- GitHub storage ---------- */
const GH=(()=>{
  const K='clinic-gh';
  let cfg={};try{cfg=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
  const auto=()=>{const h=location.hostname,m=h.match(/^([^.]+)\.github\.io$/i);if(!m)return{};const seg=location.pathname.split('/').filter(Boolean)[0];return{owner:m[1],repo:seg&&!/\.html?$/.test(seg)?seg:h}};
  const repo=()=>{const a=auto();return{owner:CONFIG.owner||cfg.owner||a.owner||'',repo:CONFIG.repo||cfg.repo||a.repo||'',branch:CONFIG.branch||'main',path:CONFIG.path||'data.json'}};
  let sha=null;
  const api=(p,o={})=>{const r=repo();return fetch(`https://api.github.com/repos/${r.owner}/${r.repo}/contents/${r.path}`+(p||''),{...o,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+cfg.token,'X-GitHub-Api-Version':'2022-11-28',...(o.headers||{})}})};
  const b64e=str=>{const by=new TextEncoder().encode(str);let bin='';for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin)};
  const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
  const err=(code)=>Object.assign(new Error(code),{code});
  return {
    repo, needRepo:()=>{const r=repo();return!(r.owner&&r.repo)},
    ok:()=>!!(cfg.token&&sha),
    hasToken:()=>!!cfg.token,
    async login(token,owner,repoName){cfg={token:token.trim(),owner:(owner||'').trim(),repo:(repoName||'').trim()};const st=await this.load();try{localStorage.setItem(K,JSON.stringify(cfg))}catch(e){}return st},
    async load(){const r=repo();const res=await api(`?ref=${encodeURIComponent(r.branch)}&t=${Date.now()}`,{cache:'no-store'});
      if(res.status===401)throw err('auth');if(res.status===404)throw err('notfound');if(!res.ok)throw err('net');
      const j=await res.json();sha=j.sha;const st=JSON.parse(b64d(j.content));
      const perm=await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}`,{headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'}}).then(x=>x.ok?x.json():null).catch(()=>null);
      if(perm&&perm.permissions&&!perm.permissions.push)throw err('perm');
      return st},
    async save(st){const r=repo();const body={message:`更新門診表 ${new Date().toLocaleString('zh-TW',{hour12:false})}`,content:b64e(JSON.stringify(st,null,1)+'\n'),sha,branch:r.branch};
      const res=await api('',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(res.status===409||res.status===422)throw err('conflict');if(res.status===401)throw err('auth');if(res.status===403||res.status===404)throw err('perm');if(!res.ok)throw err('net');
      const j=await res.json();sha=j.content.sha},
    logout(keepRepo){cfg=keepRepo?{owner:cfg.owner,repo:cfg.repo}:{};sha=null;try{localStorage.setItem(K,JSON.stringify(cfg))}catch(e){}}
  };
})();

function openLogin(){
  const need=GH.needRepo(),r=GH.repo();
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<form class="box" id="lgForm"><h3 style="margin:0">管理者登入</h3>
   <p class="hint">貼上 GitHub 金鑰（只需設定一次，這台裝置會記住）。客人不會看到這個畫面。</p>
   ${need?`<div class="form"><label class="fld">GitHub 帳號<input id="lgOwner" value="${esc(r.owner)}" autocomplete="off"></label><label class="fld">Repository 名稱<input id="lgRepo" value="${esc(r.repo)}" autocomplete="off"></label></div>`:`<p class="hint">資料位置：${esc(r.owner)}/${esc(r.repo)}</p>`}
   <label class="fld">金鑰（github_pat_ 開頭）<input id="lgTok" type="password" autocomplete="off" required></label>
   <p class="hint" id="lgMsg"></p>
   <div class="frow"><button class="btn pri" type="submit">登入</button><button class="btn" type="button" id="lgX">取消</button></div></form>`;
  document.body.appendChild(m);$('#lgTok',m).focus();
  $('#lgX',m).onclick=()=>m.remove();
  $('#lgForm',m).onsubmit=async e=>{e.preventDefault();const msg=$('#lgMsg',m);msg.textContent='驗證中…';
    try{const st=await GH.login($('#lgTok',m).value,$('#lgOwner',m)?.value,$('#lgRepo',m)?.value);
      state=st;savedJSON=JSON.stringify(state);canEdit=true;m.remove();toast('登入成功');render()}
    catch(er){const c=er&&er.code;msg.innerHTML=`<b>${c==='auth'?'金鑰不正確或已過期':c==='notfound'?'找不到資料，請確認帳號、Repository 名稱，以及金鑰有授權這個 Repository':c==='perm'?'這組金鑰沒有「Contents：Read and write」權限':'連線失敗，請稍後再試'}</b>`;GH.logout(true)}};
}

(async()=>{
  $('#app').innerHTML='<div class="wrap"><p class="empty">門診表載入中…</p></div>';
  try{const res=await fetch('data.json?t='+Date.now(),{cache:'no-store'});state=await res.json()}
  catch(e){$('#app').innerHTML='<div class="wrap"><p class="empty">門診表暫時無法載入，請稍後重新整理。</p></div>';return}
  savedJSON=JSON.stringify(state);render();
  const wantAdmin=/[?&#]admin\b/.test(location.search+location.hash);
  if(GH.hasToken()){try{state=await GH.load();savedJSON=JSON.stringify(state);canEdit=true;if(!editing)render()}catch(e){if(e&&e.code==='auth'){GH.logout(true);if(wantAdmin)openLogin()}}}
  else if(wantAdmin)openLogin();
})();
})();
</script>
